<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html">

<h:head>
    <title>Inicio de sesión</title>
    <meta charset="UTF-8"/>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #d7e9e3; /* Fondo verde claro */
        }

        /* Contenedor principal */
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        /* Banner verde con logo */
        .banner {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #007f3e; /* verde oscuro */
            color: white;
            font-size: 36px;
            font-weight: bold;
            width: 100%;
            padding: 16px 0;
            clip-path: polygon(0 0, 100% 0, 95% 100%, 5% 100%);
            margin-bottom: 40px;
            box-shadow: 0px 3px 6px rgba(0,0,0,0.2);
        }

        .banner img {
            width: 60px;
            height: auto;
            margin-right: 15px;
        }

        /* Tarjeta central */
        .card {
            background: #fff;
            padding: 30px 40px;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            text-align: center;
            width: 320px;
        }

        .card h2 {
            margin-bottom: 20px;
            font-size: 24px;
        }

        /* Inputs */
        .card label {
            display: block;
            text-align: left;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .card input {
            width: 100%;
            padding: 10px;
            margin-bottom: 16px;
            border-radius: 4px;
            border: 1px solid #ccc;
            box-shadow: 2px 2px 0px #ddd;
        }

        /* Botón */
        .btn {
            background-color: #007f3e;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
        }

        .btn:hover {
            background-color: #005f2d;
        }
    </style>
</h:head>

<h:body>
    <div class="container">
        <!-- Banner -->
        <div class="banner">
            <h:graphicImage value="resources/images/uabc_escudo.png" alt="Logo"/>
            <span>SAUAP</span>
        </div>

        <!-- Card de login -->
        <div class="card">
            <h2>Inicio de sesión</h2>

            <h:form>
                <label for="usuario">Usuario</label>
                <h:inputText id="usuario" value="#{loginBean.usuario}"
                             placeholder="Usuario"/>

                <label for="password">Contraseña</label>
                <h:inputSecret id="password" value="#{loginBean.password}"
                               placeholder="Contraseña"/>

                <h:commandButton value="Iniciar sesión"
                                 action="#{loginBean.login}"
                                 styleClass="btn"/>
            </h:form>
        </div>
    </div>
</h:body>
</html>
