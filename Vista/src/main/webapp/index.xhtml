<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html">

<h:head>
    <title>SAUAP</title>
    <meta charset="UTF-8"/>
    <style>
        /* ttodo el documento */
        body{
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #e3f0eb;
        }
        /*barra lateral*/
        .barra_lateral {
            position: fixed;
            top: 0;
            left: 0;
            width: 200px;
            height: 100%;
            background-color: #c1ded3;
        }

        /*Logo verde de SAUAP*/
        .logo {
            background-color: #1b7a3a;
            color: white;
            padding: 10px 40px;
            font-weight: bold;
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: Georgia, 'Times New Roman', Times, serif;
            width: 120%;
            height: 80px;
            margin-left: -30px;
            clip-path: polygon(0 0, 100% 0, 90% 100%, 0% 100%);
            margin-top: 15px;
        }

        /*Logo verde de SAUAP la imagen*/
        .logo img{
            width: 54px;
            height: 81px;
        }

        /*Logo verde de SAUAP el texto*/
        .barra_lateral p{
            font-size: 30px;
            letter-spacing: 3px;
            padding-left: 20px
        }

        .barra_lateral ul {
            list-style: none;
            margin: 20px 0 0 0;
            padding: 0;
        }

        /*Cada boton de la barra lateral*/
        .barra_lateral li{
            padding: 12px 20px;
            cursor: pointer;
            font-size: 15px;
            display: flex;
            align-items: center;
            border-radius: 10px;
            margin-bottom: 5px;
            color: #827D7D;
            text-decoration: none;
        }

        /*El link de cada boton de la barra lateral*/
        .barra_lateral li a{
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            width: 100%;
        }

        /*La imagen/icono de cada boton de la barra lateral*/
        .barra_lateral li img{
            width: 30px;
            height: 30px;
        }

        /*Hover de cada boton de la barra lateral*/
        .barra_lateral li:hover{
            background-color: #d7ece0;
            color: #68A88F;
            transform: scale(1.05);
            width: 150px;
            height: 30px;
            text-decoration: none;
        }

        /* La propiedad que va a adoptar el elemento de la barra lateral en el que estemos actualmente */
        .active {
            color: #68A88F;
            background-color: #d7ece0;
            width: 150px;
            height: 30px;
            text-decoration: none;
        }

        /*elimina que se vean como un link los botones*/
        .barra_lateral li.active a{
            background-color: #d7ece0;
            color: #68A88F;
        }

        /*Elimina qie se vean como link los botones ya visitados*/
        .barra_lateral li a:visited {
            color: #827D7D;
        }

        .barra_lateral li a:visited:hover{
            color: #68A88F;
            background-color: #d7ece0;
        }

        /*Hace que el boton activo no sea afectado por el hover*/
        .barra_lateral li.active:hover {
            background-color: #d7ece0;
            color: #68A88F;
            transform: none;
            text-decoration: none;
        }

        /* contenido principal de la derecha */
        .main {
            margin-left: 220px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        /* afecta al contenedor que tiene las dos columnas  de profesor y clases*/
        .cards {
            display: flex;
            gap: 60px;
        }
        /* afecta cada columna del contenedor */
        .card-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        /* afecta a la terjeta blanca como tal de profesor/clase */
        .card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            padding: 30px;
            width: 250px;
            text-align: center;
        }
        /* afecta el texto de cada  terjeta blanca como tal de profesor/clase */
        .card h1 {
            font-size: 50px;
            margin: 0;
            color: #555;
        }
        /* afecta el texto de cada  terjeta blanca como tal de profesor/clase */
        .card p {
            margin: 10px 0 0 0;
            font-size: 18px;
            color: #777;
        }
        /* afecta a los botones debajo de las tarjetas blancas */
        .btn {
            display: inline-block;
            background-color: #1b7a3a;
            color: white;
            padding: 8px 14px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 14px;
            cursor: pointer;
        }
        /* afecta a los botones debajo de las tarjetas blancas */
        .btn:hover {
            background-color: #145c2c;
        }


    </style>
</h:head>

<h:body>
    <!-- Barra lateral -->
    <div class="barra_lateral">

        <!-- Baner verde de SAUAP -->
        <div class="logo">
            <h:graphicImage value="uabc_escudo.png" alt="Logo"/>
            <p>SAUAP</p>
        </div>
        <!-- lista de los botones de la barra lateral -->
        <ul>
            <!-- primer boton de la barra lateral -->
            <li class="#{facesContext.viewRoot.viewId eq '/login.xhtml' ? 'active' : ''}">
                <h:link outcome ="/login.xhmtl">
                    <img src="home.png" alt="login"/>
                    <h:outputText value="Inicio"/>
                </h:link>
            </li>
            <!-- segundo boton de la barra lateral -->
            <li class="#{faceContext.viewRoot.viewId eq '/profesores.xhtml' ? 'active' : ''}">
                <h:link outcome="/profesores.xhtml">
                    <img src="person.png" alt="Profesores"/>
                    <h:outputText value="Profesores"/>
                </h:link>
            </li>
            <!-- tercer boton de la barra lateral -->
            <li class="#{facesContext.viewRoot.viewId eq '/clases.xhtml' ? 'active' : ''}">
                <h:link outcome="/clases.xhtml">
                    <img src="book.png" alt="Clases"/>
                    <h:outputText value="Clases"/>
                </h:link>
            </li>
            <!-- cuarto boton de la barra lateral -->
            <li class="#{facesContext.viewRoot.viewId eq '/asignaciones.xhtml' ? 'active' : ''}">
                <h:link outcome="/asignaciones.xhtml">
                    <img src="link.png" alt="Asignaciones"/>
                    <h:outputText value="Asignaciones"/>
                </h:link>
            </li>
        </ul>
    </div>

    <!-- Contenido principal a la derecha -->
    <div class="main">
        <div class="cards">
            <div class="card-container">
                <div class="card">
                    <h1>#{dashboardBean.totalProfesores}</h1>
                    <p>Profesores</p>
                </div>
                <h:link outcome="/agregar_profesor.xhtml" styleClass="btn" value="+ Agregar un Profesor"/>
            </div>

            <div class="card-container">
                <div class="card">
                    <h1>#{dashboardBean.totalClases}</h1>
                    <p>Clases</p>
                </div>
                <h:link outcome="/agregar_clase.xhtml" styleClass="btn" value="+ Agregar una Clase"/>
            </div>
        </div>
    </div>
</h:body>
</html>
