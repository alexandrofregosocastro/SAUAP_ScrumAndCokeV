<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html">

<h:head>
    <title>Inicio de sesión</title>
    <meta charset="UTF-8"/>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #e3f0eb;
            display: flex;
            justify-content: center;
        }

        /* Contenedor general */
        .layout {
            display: grid;
            grid-template-columns: 200px 1fr 200px; /* verde - contenido - verde */
            width: 100%;
            min-height: 100vh;
        }

        /* Barras laterales verdes */
        .sidebar {

            background-color: #C1DED3;
        }

        /* Contenido central */
        .main {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        /* Banner superior */
        .banner {
            background-color: #1b7a3a;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            font-size: 60px;
            font-weight: bold;
            font-family: Georgia, 'Times New Roman', Times, serif;
            padding: 12px 30px;
            border-radius: 0 0 10px 10px;
            width: 60%;
            clip-path: polygon(0 0, 100% 0, 95% 100%, 5% 100%);
            margin: 20px auto;
        }

        .banner img {
            width: 54px;
            height: 81px;
        }

        /* Caja de login */
        .login-box {
            margin-top: 60px;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
            text-align: center;
            width: 320px;
        }

        .input-field {
            width: 80px ;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }

        .login-box h2 {
            margin-bottom: 20px;
        }



        .input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background-color: #1b7a3a;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .btn:hover {
            background-color: #145c2c;
        }
    </style>
</h:head>

<h:body>
    <div class="layout">
        <!-- barra verde de la izquierda -->
        <div class="sidebar"></div>
        <div class="main">
            <div class="banner">
                <h:graphicImage value="uabc_escudo.png" alt="Logo"/>
                <span>SAUAP</span>
            </div>

            <div class="login-box">
                <h2>Inicio de sesión</h2>
                <h:form>
                    <h:outputLabel for="usuario" value="Usuario"/><br/>
                    <h:inputText class="input-field" id="usuario" styleClass="input" placeholder="usuario"/><br/>

                    <h:outputLabel for="password" value="Contraseña"/><br/>
                    <h:inputSecret class="input-field" id="password" styleClass="input" placeholder="Contraseña"/><br/>

                    <h:button value="Iniciar sesión"
                              outcome="inicio.xhtml"
                              styleClass="btn"/>

                </h:form>
            </div>
        </div>
        <!-- barra verde de la derecha -->
        <div class="sidebar"></div>
    </div>
</h:body>
</html>
